<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <style>

            body{
                margin:0;
                padding:0;
            }

            .certificate{
                position:relative;
                width:1123px;
                height:794px;
            }

            .bg{
                position:absolute;
                width:100%;
                height:100%;
            }

            .number{
                position:absolute;
                top:215px;
                width:100%;
                text-align:center;
                font-size:24px;
                font-weight:500;
            }

            .name{
                position:absolute;
                top:320px;
                width:100%;
                text-align:center;
                font-size:50px;
                font-weight:bold;
            }

            .period{
                position:absolute;
                top:475px; 
                width:100%;
                text-align:center;
                font-size:24px;
                font-weight:normal;
            }

            .qr{
                position:absolute;
                bottom:20px;
                left:25px;
                width:110px;
            }

        </style>
    </head>

    <body>

        <div class="certificate">

            <img src="{{template}}" class="bg"/>

            <div class="number">
                {{number}}
            </div>

            <div class="name">
                {{name}}
            </div>

            <div class="period">
                {{period}}
            </div>

            <img src="{{qr}}" class="qr" />

        </div>

    </body>
</html>
